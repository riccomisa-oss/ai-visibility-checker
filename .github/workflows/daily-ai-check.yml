name: Daily AI Visibility Check

on:
  # 자동(매일) 측정 비활성화 — 웹검색 API 비용 절감, 사용자가 직접 실행할 때만 측정.
  # schedule:
  #   - cron: '0 0 * * *'   # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch:        # 수동 실행 전용 (GitHub Actions UI 또는 gh workflow run)

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # data/ 디렉토리를 커밋하기 위해 필요

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: AI 노출 체크 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOVAX_API_KEY: ${{ secrets.CLOVAX_API_KEY }}
        run: python -m checker.main

      - name: 결과 데이터 업로드 (push 실패해도 데이터는 건진다)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-visibility-data
          path: data/ai-visibility/
          retention-days: 30

      - name: 결과 데이터 커밋 & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: AI 노출 데이터 업데이트 $(date +'%Y-%m-%d')"
          # 측정이 도는 동안(수 분) 누가 main에 push하면 여기서 rejected 되고
          # 방금 돈 측정 결과(API 비용 $2~3)가 통째로 날아간다. 실제로 2026-07-14에
          # 그렇게 한 번 날렸다. rebase로 원격 변경을 흡수한 뒤 재시도한다.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 실패 — 원격이 앞서갔다. 재시도 $i/3"
            sleep 5
          done
          echo "::error::데이터 push 실패. 위 upload-artifact 스텝에서 결과를 내려받을 것."
          exit 1
